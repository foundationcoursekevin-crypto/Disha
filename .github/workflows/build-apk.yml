name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare web files
        run: |
          mkdir -p www
          if [ -f index.html ]; then cp index.html www/index.html; fi
          test -f www/index.html || { echo "ERROR: index.html is missing from the repo"; exit 1; }

      - name: Set up Capacitor
        run: |
          rm -f package.json package-lock.json capacitor.config.*
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init Disha com.nadika.disha --web-dir www
          npx cap add android

      - name: Location permission and portrait mode
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/></manifest>#' $M
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' $M

      - name: Draw app icon
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os
          NAVY=(20,24,63);WHITE=(255,255,255);ORG=(255,154,61);GRN=(63,207,148)
          def make(size,rounded,scale):
              S=size*4
              img=Image.new("RGBA",(S,S),(0,0,0,0));d=ImageDraw.Draw(img)
              if rounded: d.rounded_rectangle([0,0,S-1,S-1],radius=int(S*0.23),fill=NAVY)
              else: d.rectangle([0,0,S,S],fill=NAVY)
              c=S/2;R=S*0.36*scale;w=max(int(S*0.045*scale),2)
              d.ellipse([c-R,c-R,c+R,c+R],outline=WHITE,width=w)
              L=R*0.72;B=R*0.26
              d.polygon([(c,c-L),(c+B,c),(c-B,c)],fill=ORG)
              d.polygon([(c,c+L),(c+B,c),(c-B,c)],fill=GRN)
              r=R*0.09
              d.ellipse([c-r,c-r,c+r,c+r],fill=NAVY,outline=WHITE,width=max(int(w*0.5),2))
              return img.resize((size,size),Image.LANCZOS)
          RES="android/app/src/main/res"
          icon=make(512,True,1);fg=make(432,False,0.82)
          for d,s in {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}.items():
              p=RES+"/mipmap-"+d;os.makedirs(p,exist_ok=True)
              for n in ("ic_launcher.png","ic_launcher_round.png"):
                  icon.resize((s,s),Image.LANCZOS).save(p+"/"+n)
          os.makedirs(RES+"/drawable-nodpi",exist_ok=True)
          fg.save(RES+"/drawable-nodpi/disha_fg.png")
          os.makedirs(RES+"/values",exist_ok=True)
          open(RES+"/values/disha_colors.xml","w").write('<?xml version="1.0" encoding="utf-8"?><resources><color name="disha_bg">#14183F</color></resources>')
          os.makedirs(RES+"/mipmap-anydpi-v26",exist_ok=True)
          x='<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/disha_bg"/><foreground android:drawable="@drawable/disha_fg"/></adaptive-icon>'
          for n in ("ic_launcher.xml","ic_launcher_round.xml"):
              open(RES+"/mipmap-anydpi-v26/"+n,"w").write(x)
          print("icons ok")
          PY

      - name: Copy web files into app
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Disha-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
